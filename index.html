<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UnattendedWinstall Customizer</title>
  <meta name="description" content="Browser-based customizer for the UnattendedWinstall autounattend.xml answer file.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <svg class="logo" viewBox="0 0 36 36" aria-hidden="true">
        <rect width="36" height="36" rx="8" fill="#1b8fd6"/>
        <path d="M8 9h9v9H8zm11 0h9v9h-9zM8 20h9v9H8zm11 0h9v9h-9z" fill="#fff"/>
      </svg>
      <div>
        <h1>UnattendedWinstall Customizer</h1>
        <p>Edit autounattend.xml in the browser, then download it</p>
        <p class="app-version" id="app-version" hidden></p>
      </div>
    </div>
    <label class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
        <path d="M20 20l-3.2-3.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input id="search" type="search" placeholder="Search apps, settings, services…" autocomplete="off">
    </label>
    <div class="header-actions">
      <button class="btn btn-ghost" id="resetBtn" type="button">Reset</button>
      <button class="btn" id="copyBtn" type="button">Copy XML</button>
      <button class="btn btn-primary" id="downloadBtn" type="button">Download autounattend.xml</button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Categories"></nav>
    <main class="main" id="main">
      <div class="loading" id="boot">Loading autounattend.xml…</div>
    </main>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="js/meta.js"></script>
  <script src="js/core.js"></script>
  <script src="js/app.js"></script>
  <script>
    const APP_REPO = "vicholz/UnattendedWinstall";
    const APP_VERSION_FALLBACK_SHA = "e77dde5becf1349867e31e3d3b48154bdcf19cfd";

    function renderAppVersion(sha) {
      const el = document.querySelector("#app-version");
      if (!el || !sha) return;
      el.replaceChildren();
      el.append("Version ");
      const a = document.createElement("a");
      a.href = "https://github.com/" + APP_REPO + "/commit/" + sha;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = sha.slice(0, 7);
      a.title = "View the diff for this version";
      el.appendChild(a);
      el.hidden = false;
    }

    function loadAppVersion() {
      renderAppVersion(APP_VERSION_FALLBACK_SHA);
      fetch("https://api.github.com/repos/" + APP_REPO + "/commits/main")
        .then(function (res) {
          if (!res.ok) throw new Error(res.status);
          return res.json();
        })
        .then(function (commit) {
          if (commit.sha) renderAppVersion(commit.sha);
        })
        .catch(function () {});
    }

    loadAppVersion();
  </script>
</body>
</html>
